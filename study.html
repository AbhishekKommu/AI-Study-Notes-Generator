<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Study Notes Generator</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(
    -45deg,
    #667eea,
    #764ba2,
    #00c9a7,
    #ff6b6b);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    width:95%;
    max-width:1000px;
    padding:30px;
    border-radius:25px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 8px 32px rgba(0,0,0,0.25);
}

h1{
    text-align:center;
    color:white;
    margin-bottom:20px;
}

textarea{
    width:100%;
    height:220px;
    border:none;
    outline:none;
    border-radius:15px;
    padding:15px;
    font-size:16px;
    resize:none;
}

button{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:none;
    border-radius:15px;
    background:white;
    color:#764ba2;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
}

.output{
    margin-top:20px;
    padding:25px;
    border-radius:15px;
    background:rgba(255,255,255,0.15);
    color:white;
    line-height:1.8;
}

.section{
    margin-bottom:20px;
}

.section h2{
    margin-bottom:10px;
    color:#fff;
}

ul{
    margin-left:20px;
}

</style>
</head>
<body>

<div class="container">

<h1>📚 AI Study Notes Generator</h1>

<textarea
id="inputText"
placeholder="Paste your study material here...">
</textarea>

<button onclick="generateNotes()">
✨ Generate Notes
</button>

<div class="output" id="output">
Your notes, key points, and quiz questions will appear here...
</div>

</div>

<script>

function generateNotes(){

let text =
document.getElementById("inputText").value;

if(text.trim() === ""){
alert("Please enter study material.");
return;
}

let sentences =
text.split(/[.!?]+/)
.filter(sentence => sentence.trim() !== "");

let notes =
sentences.slice(0,5);

let keyPoints =
sentences.slice(0,3);

let quizQuestions =
sentences.slice(0,3).map(
(item,index)=>
`Q${index+1}: Explain "${item.trim()}" ?`
);

document.getElementById("output").innerHTML =

`
<div class="section">
<h2>📝 Short Notes</h2>
<ul>
${notes.map(
n => `<li>${n.trim()}</li>`
).join("")}
</ul>
</div>

<div class="section">
<h2>🎯 Key Points</h2>
<ul>
${keyPoints.map(
k => `<li>${k.trim()}</li>`
).join("")}
</ul>
</div>

<div class="section">
<h2>❓ Quiz Questions</h2>
<ul>
${quizQuestions.map(
q => `<li>${q}</li>`
).join("")}
</ul>
</div>
`;

}

</script>

</body>
</html>
